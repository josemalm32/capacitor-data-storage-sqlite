name: Build and publish

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - "*"

jobs:
  # Tests already passed before tag was created, so just build and deploy
  deploy:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    name: "Build and publish to npm"
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Build
        id: build_code
        run: bun run build
      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm
        if: ${{ !contains(github.ref, '-alpha.') }}
        run: npm publish --provenance --access public
      - name: Publish to npm with next tag
        if: ${{ contains(github.ref, '-alpha.') }}
        run: npm publish --tag next --provenance --access public
      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
          prerelease: ${{ contains(github.ref_name, '-alpha.') }}
